<!DOCTYPE html>
<html lang="es" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta | A&S Barber Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dorado: {
                            300: '#fed7aa',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                            800: '#92400e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="min-h-screen text-stone-100 flex flex-col justify-between relative overflow-y-auto overflow-x-hidden font-sans selection:bg-amber-500 selection:text-black">

    <div class="fixed inset-0 z-0 pointer-events-none">
        <img src="/img/bg-barber.jpg" alt="A&S Barber Shop Local Miraflores" class="w-full h-full object-cover filter brightness-[0.92] contrast-[1.05] saturate-[1.1]">
        <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-black/20 to-black/75"></div>
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_transparent_0%,_rgba(0,0,0,0.50)_100%)]"></div>
    </div>

    <div id="contenedor-notificaciones" class="fixed top-6 right-6 z-50 flex flex-col gap-3 max-w-md w-full px-4 pointer-events-none"></div>

    <div class="relative z-10 w-full py-2"></div>

    <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-3 sm:py-5 my-auto">
        <div class="w-full max-w-[510px] bg-[#0c0b0a]/92 backdrop-blur-2xl border border-amber-500/40 rounded-3xl p-5 sm:p-7 shadow-[0_20px_70px_rgba(0,0,0,0.95),0_0_35px_rgba(217,119,6,0.18)] ring-1 ring-white/10 relative">
            <div class="absolute -top-px left-1/2 -translate-x-1/2 w-44 h-[2px] bg-gradient-to-r from-transparent via-amber-400 to-transparent"></div>

            <div class="text-center">
                <div class="inline-block p-[2px] rounded-2xl bg-gradient-to-b from-[#f59e0b] via-[#b45309] to-[#451a03] shadow-md shadow-black/80">
                    <img src="/img/logo.jpg" alt="Logo A&S Barber Shop" class="w-13 h-13 sm:w-14 sm:h-14 object-cover rounded-[14px]">
                </div>
                
                <div class="flex items-center justify-center gap-2 mt-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <p class="text-amber-400 text-[10px] sm:text-[11px] font-bold tracking-[0.25em] uppercase">
                        BARBERÍA CLÁSICA · MIRAFLORES
                    </p>
                </div>

                <h1 class="text-white font-extrabold text-2xl tracking-tight mt-1 font-sans">
                    Crear Cuenta
                </h1>
                <p class="text-stone-400 text-xs mt-0.5">
                    Regístrate para reservar y gestionar tus citas
                </p>
            </div>

            <form id="formulario-registro" class="mt-4 space-y-2.5 sm:space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3">
                    <div>
                        <label for="reg-nombre" class="block text-[11px] font-medium text-stone-300 mb-1">
                            Nombres
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-amber-500/90">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                            </span>
                            <input 
                                type="text" 
                                id="reg-nombre" 
                                required
                                placeholder="Ej. Carlos Alberto"
                                class="w-full bg-[#141210]/95 border border-amber-600/60 hover:border-amber-500 focus:border-amber-400 focus:ring-1 focus:ring-amber-400 text-stone-100 rounded-xl px-3.5 py-2 pl-9 text-xs sm:text-sm placeholder:text-stone-500 outline-none transition duration-150 shadow-inner">
                        </div>
                    </div>

                    <div>
                        <label for="reg-apellido" class="block text-[11px] font-medium text-stone-300 mb-1">
                            Apellidos
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-amber-500/90">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                            </span>
                            <input 
                                type="text" 
                                id="reg-apellido" 
                                required
                                placeholder="Ej. Mendoza Quispe"
                                class="w-full bg-[#141210]/95 border border-amber-600/60 hover:border-amber-500 focus:border-amber-400 focus:ring-1 focus:ring-amber-400 text-stone-100 rounded-xl px-3.5 py-2 pl-9 text-xs sm:text-sm placeholder:text-stone-500 outline-none transition duration-150 shadow-inner">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3">
                    <div>
                        <label for="reg-correo" class="block text-[11px] font-medium text-stone-300 mb-1">
                            Correo electrónico
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-amber-500/90">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                                </svg>
                            </span>
                            <input 
                                type="email" 
                                id="reg-correo" 
                                required
                                placeholder="nombre@ejemplo.com"
                                class="w-full bg-[#141210]/95 border border-amber-600/60 hover:border-amber-500 focus:border-amber-400 focus:ring-1 focus:ring-amber-400 text-stone-100 rounded-xl px-3.5 py-2 pl-9 text-xs sm:text-sm placeholder:text-stone-500 outline-none transition duration-150 shadow-inner">
                        </div>
                    </div>

                    <div>
                        <label for="reg-telefono" class="block text-[11px] font-medium text-stone-300 mb-1">
                            Teléfono / Celular
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-amber-500/90">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                </svg>
                            </span>
                            <input 
                                type="tel" 
                                id="reg-telefono" 
                                placeholder="999 888 777"
                                class="w-full bg-[#141210]/95 border border-amber-600/60 hover:border-amber-500 focus:border-amber-400 focus:ring-1 focus:ring-amber-400 text-stone-100 rounded-xl px-3.5 py-2 pl-9 text-xs sm:text-sm placeholder:text-stone-500 outline-none transition duration-150 shadow-inner">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3">
                    <div>
                        <label for="reg-clave" class="block text-[11px] font-medium text-stone-300 mb-1">
                            Contraseña
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-amber-500/90">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                                </svg>
                            </span>
                            <input 
                                type="password" 
                                id="reg-clave" 
                                required
                                minlength="6"
                                placeholder="••••••••"
                                class="w-full bg-[#141210]/95 border border-amber-600/60 hover:border-amber-500 focus:border-amber-400 focus:ring-1 focus:ring-amber-400 text-stone-100 rounded-xl px-3.5 py-2 pl-9 pr-9 text-xs sm:text-sm placeholder:text-stone-500 outline-none transition duration-150 shadow-inner">
                            <button 
                                type="button" 
                                data-ver-clave="reg-clave"
                                title="Mostrar u ocultar"
                                class="absolute inset-y-0 right-0 flex items-center pr-2.5 text-stone-400 hover:text-amber-400 transition cursor-pointer">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label for="reg-confirmar-clave" class="block text-[11px] font-medium text-stone-300 mb-1">
                            Confirmar contraseña
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-amber-500/90">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                                </svg>
                            </span>
                            <input 
                                type="password" 
                                id="reg-confirmar-clave" 
                                required
                                minlength="6"
                                placeholder="••••••••"
                                class="w-full bg-[#141210]/95 border border-amber-600/60 hover:border-amber-500 focus:border-amber-400 focus:ring-1 focus:ring-amber-400 text-stone-100 rounded-xl px-3.5 py-2 pl-9 pr-9 text-xs sm:text-sm placeholder:text-stone-500 outline-none transition duration-150 shadow-inner">
                            <button 
                                type="button" 
                                data-ver-clave="reg-confirmar-clave"
                                title="Mostrar u ocultar"
                                class="absolute inset-y-0 right-0 flex items-center pr-2.5 text-stone-400 hover:text-amber-400 transition cursor-pointer">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="pt-0.5">
                    <label class="flex items-start gap-2 cursor-pointer select-none text-[11px] text-stone-300 hover:text-stone-100 transition leading-snug">
                        <input 
                            type="checkbox" 
                            id="reg-terminos"
                            required
                            class="w-3.5 h-3.5 mt-0.5 rounded border-amber-900 bg-stone-900 text-amber-500 focus:ring-amber-500/40 focus:ring-offset-0 shrink-0">
                        <span>
                            Acepto los 
                            <a href="#" onclick="alert('Términos y Condiciones del Servicio: Al registrarte en A&S Barber Shop podrás reservar citas, acumular visitas y acceder a promociones exclusivas.'); return false;" class="text-amber-400 hover:text-amber-300 underline underline-offset-2">términos y condiciones</a> 
                            y la 
                            <a href="#" onclick="alert('Política de Privacidad: Tus datos se usarán exclusivamente para la gestión de tus reservas y notificaciones del servicio.'); return false;" class="text-amber-400 hover:text-amber-300 underline underline-offset-2">política de privacidad</a>
                        </span>
                    </label>
                </div>

                <button 
                    type="submit" 
                    id="btn-registro"
                    class="w-full mt-1 bg-gradient-to-r from-[#d97706] to-[#b45309] hover:from-[#e59b1a] hover:to-[#c26d07] text-stone-950 font-bold py-2.5 px-5 rounded-xl shadow-lg shadow-amber-950/70 flex items-center justify-center gap-2 transition-all duration-150 transform active:scale-[0.99] cursor-pointer text-xs sm:text-sm">
                    <span>Registrarme como Cliente</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </button>

                <div class="text-center pt-1 text-xs text-stone-400">
                    ¿Ya tienes una cuenta? 
                    <a href="/pages/login.html" class="text-amber-400 hover:text-amber-300 font-semibold hover:underline ml-1">
                        Inicia sesión aquí
                    </a>
                </div>
            </form>
        </div>
    </main>

    <footer class="relative z-10 w-full px-4 py-4 flex flex-col items-center justify-center gap-1.5 text-xs select-none">
        <div class="flex items-center justify-center gap-2 sm:gap-3.5 text-[11px] sm:text-xs text-stone-400 flex-wrap text-center">
            <span class="flex items-center gap-1 text-stone-300">
                <svg class="w-3.5 h-3.5 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                Av. José Pardo 620, Miraflores
            </span>
            <span class="text-amber-500/50 hidden sm:inline">•</span>
            <span class="flex items-center gap-1">
                <svg class="w-3.5 h-3.5 text-amber-500/80 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Lun - Sáb: 10:00 - 21:00
            </span>
            <span class="text-amber-500/50 hidden sm:inline">•</span>
            <span>Dom: 10:00 - 19:00</span>
        </div>

        <div class="flex items-center justify-center gap-3 text-[11px] text-stone-400 mt-0.5">
            <span>© 2026 Barbershop A&S</span>
            <span class="text-stone-700">·</span>
            <a href="#" class="hover:text-amber-400 transition hover:underline">Privacidad y términos</a>
        </div>
    </footer>

    <script src="/js/auth/auth.js"></script>
</body>
</html>
